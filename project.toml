# Alias file for pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-impakta"
version = "0.1.0"
description = "Social Media KPI Dashboard & Monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "cryptography>=43.0.0",
    "starlette>=0.39.0",
    "itsdangerous>=2.2.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "libsql-client>=0.3.1",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
