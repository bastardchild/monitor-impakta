<div style="margin-top:0.75rem;padding:0.75rem 1rem;border-radius:10px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:0.75rem;{% if status == 'success' %}background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.25);{% else %}background:rgba(244,63,94,0.12);color:#fb7185;border:1px solid rgba(244,63,94,0.25);{% endif %}"
     x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)" x-transition x-cloak>
    <div style="display:flex;align-items:center;gap:0.5rem;">
        {% if status == 'success' %}
        <svg style="width:16px;height:16px;color:#34d399;flex-shrink:0;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        {% else %}
        <svg style="width:16px;height:16px;color:#fb7185;flex-shrink:0;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" d="M12 8v4m0 4h.01" />
        </svg>
        {% endif %}
        <span>{{ message }}</span>
    </div>
    <button type="button" @click="show = false" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;">
        <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>
